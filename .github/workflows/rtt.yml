name: rtt-identity
on:
  push:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  pull-requests: read
jobs:
  rtt-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Twin MD5 + hashlock + scene/SE gates
        run: python .github/scripts/rtt-ci-gate.py
      - name: RTT unit tests
        run: python -m unittest discover -v -s interfaces/observation/reverse-turing-test/tests -p "test_*.py"
      - name: Source identity GitHub API checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m unittest tests.test_source_identity -v
